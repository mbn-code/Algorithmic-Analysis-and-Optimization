name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "results/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp results/sort.csv results/search.csv results/meta.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
