<title>Two line charts: quicksort variants slowing down quadratically on sorted and adversarial input</title>
<rect width="960" height="400" rx="6" fill="#0b2340"/>
<text x="28" y="40" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700">Two inputs that make quicksort quadratic</text>
<text x="28" y="62" fill="#a9bfd4" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13">Last-element pivots fail on sorted input; median-of-three fails on an adversary. Introsort caps the damage.</text>
