<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Bar chart: time per element to sort one million random integers, per algorithm">
<title>Bar chart: time per element to sort one million random integers, per algorithm</title>
<rect width="880" height="420" rx="6" fill="#0b2340"/>
<text x="28" y="40" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700">Sorting 1M random 32-bit integers</text>
<text x="28" y="62" fill="#a9bfd4" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13">Median nanoseconds per element, lower is better. Compared with std::sort.</text>
<defs><pattern id="h4" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#199e70" fill-opacity="0.25"/><line x1="0" y1="0" x2="0" y2="6" stroke="#199e70" stroke-width="3"/></pattern><pattern id="h8" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d95926" fill-opacity="0.25"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d95926" stroke-width="3"/></pattern></defs><text x="198" y="111" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">radix_sort</text><rect x="210" y="97" width="16.7" height="20" rx="2" fill="#c98500"/><text x="236.7" y="111" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">3.44 ns <tspan fill="#a9bfd4" font-weight="400">13.8x faster</tspan></text><text x="198" y="143" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">quick_sort</text><rect x="210" y="129" width="210.3" height="20" rx="2" fill="#199e70"/><text x="430.3" y="143" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">43.4 ns <tspan fill="#a9bfd4" font-weight="400">1.1x faster</tspan></text><text x="198" y="175" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">intro_sort</text><rect x="210" y="161" width="211.2" height="20" rx="2" fill="#199e70"/><text x="431.2" y="175" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">43.6 ns <tspan fill="#a9bfd4" font-weight="400">1.1x faster</tspan></text><text x="198" y="207" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">std::sort</text><rect x="210" y="193" width="229.6" height="20" rx="2" fill="#e9f1f8"/><text x="449.6" y="207" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">47.4 ns <tspan fill="#a9bfd4" font-weight="400">baseline</tspan></text><text x="198" y="239" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">textbook::quick_sort</text><rect x="210" y="225" width="235.4" height="20" rx="2" fill="url(#h4)"/><text x="455.4" y="239" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">48.6 ns <tspan fill="#a9bfd4" font-weight="400">about the same</tspan></text><text x="198" y="271" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">merge_sort</text><rect x="210" y="257" width="257.2" height="20" rx="2" fill="#d95926"/><text x="477.2" y="271" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">53.1 ns <tspan fill="#a9bfd4" font-weight="400">1.1x slower</tspan></text><text x="198" y="303" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">std::stable_sort</text><rect x="210" y="289" width="265.2" height="20" rx="2" fill="#e9f1f8"/><text x="485.2" y="303" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">54.8 ns <tspan fill="#a9bfd4" font-weight="400">1.2x slower</tspan></text><text x="198" y="335" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">heap_sort</text><rect x="210" y="321" width="344.8" height="20" rx="2" fill="#9085e9"/><text x="564.8" y="335" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">71.2 ns <tspan fill="#a9bfd4" font-weight="400">1.5x slower</tspan></text><text x="198" y="367" text-anchor="end" fill="#e9f1f8" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">textbook::merge_sort</text><rect x="210" y="353" width="520.0" height="20" rx="2" fill="url(#h8)"/><text x="740.0" y="367" fill="#e9f1f8" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">107 ns <tspan fill="#a9bfd4" font-weight="400">2.3x slower</tspan></text><text x="28" y="404" fill="#a9bfd4" font-family="Archivo, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12">Hatched: textbook versions. insertion_sort is not run at this size; it is quadratic. AMD Ryzen 7 9800X3D 8-Core Processor, GCC 15.2.0, 2026-10-02.</text>
</svg>
